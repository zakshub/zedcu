name: Bootstrap npm lockfile (temporary)

on:
  push:
    branches: ["feat/phase-1-runtime-baseline"]
    paths:
      - ".github/workflows/bootstrap-lockfile.yml"

permissions:
  contents: write

jobs:
  generate-lockfile:
    runs-on: ubuntu-latest
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: feat/phase-1-runtime-baseline
          persist-credentials: true
      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Generate and verify lockfile
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          test -s package-lock.json
          npm ci --ignore-scripts --no-audit --no-fund
          npm run typecheck
          npm test
          npm run build
          npm run lint
      - name: Commit generated lockfile on feature branch
        shell: bash
        run: |
          test -s package-lock.json
          git add package-lock.json
          if git diff --cached --quiet; then
            echo "Lockfile is already committed; nothing to do."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "build: add reproducible npm lockfile"
          git push origin HEAD:feat/phase-1-runtime-baseline
