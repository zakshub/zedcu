name: CI
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
    branches: [main]
permissions:
  contents: read
jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Dependency security summary
        shell: bash
        run: |
          npm audit --json > /tmp/npm-audit-report.json || true
          node -e 'const fs=require("node:fs"); let a; try { a=JSON.parse(fs.readFileSync("/tmp/npm-audit-report.json","utf8")); } catch { console.log("Dependency audit report unavailable; inspect npm audit step output."); process.exit(0); } const v=a.metadata?.vulnerabilities ?? {}; console.log("Dependency audit summary:", JSON.stringify(v)); for (const [name, item] of Object.entries(a.vulnerabilities ?? {})) console.log(`${item.severity}: ${name} (direct=${item.isDirect}, fixAvailable=${JSON.stringify(item.fixAvailable)})`);'
      - name: Enforce dependency security threshold
        run: npm audit --audit-level=high
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Lint
        run: npm run lint

  postgres-schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: zedcu_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zedcu_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGHOST: localhost
      PGPORT: 5432
      PGDATABASE: zedcu_test
      PGUSER: postgres
      PGPASSWORD: ci-only-password
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes postgresql-client
      - name: Apply migration
        run: psql -v ON_ERROR_STOP=1 -f migrations/001_durable_task_queue.sql
      - name: Verify migration is idempotent
        run: psql -v ON_ERROR_STOP=1 -f migrations/001_durable_task_queue.sql
      - name: Assert schema and migration marker
        shell: bash
        run: |
          table_count="$(psql -Atc "SELECT count(*) FROM information_schema.tables WHERE table_schema = 'public' AND table_name LIKE 'zedcu_%';")"
          migration_count="$(psql -Atc "SELECT count(*) FROM zedcu_schema_migrations WHERE version = '001_durable_task_queue';")"
          test "$table_count" = "5"
          test "$migration_count" = "1"
      - name: Verify idempotency and lease constraints
        shell: bash
        run: |
          psql -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO zedcu_tasks (id, request, state, created_at, updated_at)
          VALUES
            ('ci-task-1', 'schema CI test', 'queued', now(), now()),
            ('ci-task-2', 'schema CI test duplicate', 'queued', now(), now());
          INSERT INTO zedcu_task_queue (task_id, idempotency_key, status)
          VALUES ('ci-task-1', 'ci-idempotency-key', 'queued');
          SQL
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO zedcu_task_queue (task_id, idempotency_key, status) VALUES ('ci-task-2', 'ci-idempotency-key', 'queued');" >/tmp/zedcu-duplicate.log 2>&1; then
            echo "ERROR: duplicate idempotency key was accepted"
            exit 1
          else
            echo "Duplicate idempotency key correctly rejected"
          fi
          if psql -v ON_ERROR_STOP=1 -c "INSERT INTO zedcu_task_queue (task_id, idempotency_key, status) VALUES ('ci-task-2', 'ci-invalid-lease', 'leased');" >/tmp/zedcu-lease.log 2>&1; then
            echo "ERROR: lease without ownership fields was accepted"
            exit 1
          else
            echo "Incomplete lease correctly rejected"
          fi
      - name: Remove schema-only fixture rows
        run: psql -v ON_ERROR_STOP=1 -c "DELETE FROM zedcu_tasks WHERE id IN ('ci-task-1', 'ci-task-2')"
      - name: Set up Node.js for PostgreSQL integration tests
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install application dependencies
        run: npm ci
      - name: Run live PostgreSQL integration tests
        run: npm run test:postgres
